detection:
  min_area_ratio: 0.002     # min plate area as fraction of image
  max_area_ratio: 0.15      # max plate area as fraction of image
  min_aspect: 1.1           # min width/height ratio (Colombian plates ~1.3-2.5)
  max_aspect: 4.0           # max width/height ratio
  canny_low: 50
  canny_high: 200
  blur_ksize: 5

enhancement:
  enabled: true
  denoise: true
  denoise_strength: 10
  upscale_factor: 2
  contrast_clip_limit: 2.0

segmentation:
  min_char_height_ratio: 0.25
  max_char_height_ratio: 0.98
  min_char_aspect: 0.1
  max_char_aspect: 1.1
  expected_chars: 6

ocr:
  model_path: models/ocr/ocr_svm.pkl
  label_encoder_path: models/ocr/ocr_le.pkl
  min_chars: 4
  min_confidence: 0.4

pipeline:
  source: "image"           # "image", "video", or "camera"
  camera_id: 0
  frame_skip: 2
  output_dir: "outputs"
  save_crops: false
  show_preview: true
